services:
  db:
    image: pgvector/pgvector:pg16
    container_name: demarcheclair-db
    environment:
      POSTGRES_USER: demarche
      POSTGRES_PASSWORD: demarche
      POSTGRES_DB: demarcheclair
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
